[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "readji-tts-agent"
version = "0.1.7"
description = "Windows TTS renderer for Readji writers"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "PySide6-Fluent-Widgets>=1.8,<2",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "triton-windows>=3.6,<3.7; sys_platform == 'win32'",
  "voxcpm==2.0.3",
]

[project.scripts]
readji-tts-agent = "readji_tts_agent.app:main"

[project.optional-dependencies]
packaging = [
  "pyinstaller>=6.11,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
